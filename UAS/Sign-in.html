<script>
function validateForm() {
  const email = document.getElementById("email").value;
  const name = document.getElementById("name").value;

  if (name === "" || email === "") {
    alert("Semua field wajib diisi!");
    return false;
  }

  if (!email.includes("@")) {
    alert("Email tidak valid!");
    return false;
  }

  alert("Form berhasil dikirim");
  return true;
}
</script>
